name: Native runtime CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native CLI
        shell: bash
        run: mkdir -p build && nim c -d:release --out:build/gzim src/gzim.nim
      - name: Run conversion suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/conversion_test.py build/gzim.exe
      - name: Run language suite
        if: runner.os != 'Windows'
        shell: bash
        run: tests/run_tests.sh
      - name: Run language server suite
        if: runner.os != 'Windows'
        shell: bash
        run: tests/lsp_test.sh
      - name: Native smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & build/gzim.exe tests/cases/fizzbuzz.gzim
          $expected = (Get-Content tests/cases/fizzbuzz.expected) -join "`n"
          if (($actual -join "`n") -ne $expected) { throw "Native output mismatch" }
          & build/gzim.exe doctor
          nim c -d:release --out:build/gzim-lsp.exe src/gzimlsp.nim
          "" | & build/gzim-lsp.exe
